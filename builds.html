<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builds - Gene Leung</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #1a1714;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('builds-bg.jpg') center center / cover no-repeat;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.35) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 32px;
    }

    .title {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(60, 50, 40, 0.85);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .buttons {
      display: flex;
      gap: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(50, 40, 30, 0.9);
      border: 1px solid rgba(80, 70, 60, 0.3);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(80, 70, 60, 0.5);
      color: rgba(30, 20, 10, 1);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .back {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: rgba(60, 50, 40, 0.7);
      border: 1px solid rgba(80, 70, 60, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .back:hover {
      background: rgba(255, 255, 255, 0.45);
      color: rgba(30, 20, 10, 0.9);
    }

    .back svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 22px;
      }

      .buttons {
        flex-direction: column;
        gap: 16px;
      }

      .btn {
        padding: 14px 28px;
        font-size: 14px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <a class="back" href="/">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back
  </a>
  <div class="content">
    <div class="title">Builds</div>
    <div class="buttons">
      <a class="btn" href="/GupSpine/">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        GupSpine
      </a>
      <a class="btn" href="/XFU/">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        XFU
      </a>
      <a class="btn" href="/interalia/">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
        InterAlia
      </a>
    </div>
  </div>
</body>
</html>
